name: Publicar imagem no GHCR

on:
  push:
    branches: [main, cursor/portainer-stack-delfos]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Construir e publicar imagem
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir e enviar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/flaviosantti/delfos:latest
            ghcr.io/flaviosantti/delfos:1.1.0
